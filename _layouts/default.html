<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/hoffmann-muki.jpeg' | absolute_url }}">
  <meta property="og:image:alt" content="Portrait of Hoffmann Muki">
  <meta name="twitter:card" content="summary">
  {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
</head>
<body data-baseurl="{{ site.baseurl }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">Hoffmann Muki<span aria-hidden="true">.</span></a>
    <nav class="site-nav" aria-label="Main navigation">{% for item in site.data.navigation %}<a href="{{ item.url | relative_url }}"{% if page.nav == item.key %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}</nav>
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme" hidden>
      <svg class="moon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.7 13A9 9 0 0 1 11 3.3 9 9 0 1 0 20.7 13Z"/></svg>
      <svg class="sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
    </button>
  </div></header>
  <main id="main" class="site-main" tabindex="-1">{{ content }}</main>
  <footer class="site-footer"><div class="footer-inner"><p>© {{ site.time | date: '%Y' }} Hoffmann Muki</p><div><a href="mailto:{{ site.email }}">Get in touch <span aria-hidden="true">↗</span></a><a class="back-to-top" href="#main">Back to top <span aria-hidden="true">↑</span></a></div></div></footer>
</body>
</html>
